server {
  listen 80;

  location = /_auth_verify {
    internal;
    proxy_pass http://auth_service:8093/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location /auth/ {
    proxy_pass http://auth_service:8093/;
  }

  location /private/ {
    auth_request /_auth_verify;
    auth_request_set $principal $upstream_http_x_principal_id;
    proxy_set_header X-Principal-Id $principal;
    proxy_pass http://127.0.0.1:8081/;
  }
}

# The application behind the door. It never sees a password, only the
# principal id the door hands it.
server {
  listen 127.0.0.1:8081;
  default_type text/plain;
  return 200 "hello, principal $http_x_principal_id\n";
}
