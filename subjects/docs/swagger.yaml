definitions:
  subject.Subject:
    properties:
      bio:
        type: string
      id:
        type: string
      name:
        type: string
      nick:
        description: |-
          Nick is how people and models address a subject: unique across every
          subject ever created, deleted ones included, so a nick never comes to
          mean somebody else; set once at creation and never changed. The
          database holds both rules (migrations/0001); the service only says why.
        type: string
      preferences:
        description: |-
          Preferences is a JSON object this service stores and returns as it came.
          Its keys belong to whoever reads them; the registry never looks inside.
        type: object
      subject_type:
        type: string
    type: object
host: localhost:8083
info:
  contact: {}
  description: |-
    The registry of subjects: who exists, how they are addressed
    (nick), what they are and their preferences, a JSON object
    stored as it came. Own database on its own network.
  title: Subjects
  version: "1.0"
paths:
  /health:
    get:
      description: |-
        Answers if the process is serving HTTP at all, and says nothing
        about Postgres; scripts/stack_version.py reads the version.
      produces:
      - application/json
      responses:
        "200":
          description: status and version
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe and build version
      tags:
      - health
  /ready:
    get:
      description: |-
        200 when a ping to Postgres succeeds, 503 when it does not;
        the compose healthcheck asks this one.
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: status unavailable and the ping error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 'Readiness probe: can this instance reach Postgres'
      tags:
      - health
  /subjects:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all subjects
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/subject.Subject'
            type: array
        "500":
          description: Failed to get subjects
          schema:
            type: string
      summary: Get all subjects
      tags:
      - subjects
    post:
      consumes:
      - application/json
      description: Creates a new subject with the provided details
      parameters:
      - description: Subject details
        in: body
        name: subject
        required: true
        schema:
          $ref: '#/definitions/subject.Subject'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/subject.Subject'
        "400":
          description: Invalid request body, an empty subject_type, preferences that
            are not an object, or the nick breaks its rules
          schema:
            type: string
        "409":
          description: The nick is taken
          schema:
            type: string
        "500":
          description: Failed to create subject
          schema:
            type: string
      summary: Create a new subject
      tags:
      - subjects
  /subjects/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a subject by its ID
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Status of deletion
          schema:
            type: object
        "400":
          description: Invalid subject ID format or Subject ID is required
          schema:
            type: string
        "404":
          description: Subject not found
          schema:
            type: string
        "500":
          description: Failed to delete subject
          schema:
            type: string
      summary: Delete a subject
      tags:
      - subjects
    get:
      consumes:
      - application/json
      description: Retrieves a subject based on the ID provided in the path.
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subject.Subject'
        "400":
          description: Invalid subject ID format or Subject ID is required
          schema:
            type: string
        "404":
          description: Subject not found
          schema:
            type: string
        "500":
          description: Failed to get subject
          schema:
            type: string
      summary: Get a single subject by its ID
      tags:
      - subjects
    put:
      consumes:
      - application/json
      description: 'Updates an existing subject. The body replaces the subject:'
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: string
      - description: Subject details
        in: body
        name: subject
        required: true
        schema:
          $ref: '#/definitions/subject.Subject'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subject.Subject'
        "400":
          description: Invalid subject ID format, Invalid request body, an empty subject_type,
            preferences that are not an object, or an attempt to change the nick
          schema:
            type: string
        "404":
          description: Subject not found
          schema:
            type: string
        "500":
          description: Failed to update subject
          schema:
            type: string
      summary: Update a subject
      tags:
      - subjects
schemes:
- http
swagger: "2.0"
