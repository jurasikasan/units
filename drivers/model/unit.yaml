# Manifest — what a reader outside drivers/model reads instead of its code.
# Meaning lives in CONTRACT.md; this is what a validator and an assembler read.

unit: drivers/model
kind: service
summary: A chat model holding subjects' reins as one of its profiles (a brain - a name and its chat model), whenever reins says a profile of its holds a subject - woken by threads' events when someone else says something in a thread its subject is in, it builds the prompt from the thread's tail (its subject's entries the assistant's, everyone else's the user's with who said it), has minds/assistant answer as an AG-UI run with the profile's model, streams the reply's pieces on its own stream and says the reply in the thread as the subject; it greets first in a thread its subject opened where nothing is said, and a stop from reins cuts a reply, what was written said; a failed reply gives the subject back to nobody on reins (fail fast, no retry, a steward re-attaches). No database.
contract: CONTRACT.md
maturity: probe

provides:
  events:
    stream: driver_events
    envelope: cloudevents-1.0     # contracts/events.md
    source: /drivers/model
    types:
      - driver.reply.started      # a reply is being written, nothing of it yet; ephemeral
      - driver.reply.delta        # a piece of a reply being written (part text or reasoning); ephemeral
      - driver.reply.failed       # the reply ended with nothing said, and why; the brain's failure gives the subject back (reins' release)
      - driver.reply.finished     # the reply was said, at seq
      - driver.reply.stopped      # cut: why (stopped, taken), and seq when what was written was said
  http:
    port: 8097
    calls: ["GET /profiles"]      # the brains it can be: [{name, model}], for reins to relay
  health: GET :8097/health
  ready: GET :8097/ready          # the bus answers; says whom it holds, as which profile

consumes:
  units:
    - unit: threads     # what woke it, read through its own consumer group
      via: events
      stream: threads_events
      types: [threads.entry.appended]
    - unit: threads     # the thread read back (who opened it, members, tail), the reply said in it
      via: http
      env: THREADS_URL
      calls: ["GET /threads", "GET /threads/{id}", "GET /threads/{id}/entries", "POST /threads/{id}/entries"]
    - unit: reins       # whom its profiles hold, read at boot, on each change and every 30 s (its inner port)
      via: http
      env: REINS_URL
      calls: ["GET /holds", "POST /holds/{id}/release"]   # the second: its own hold let go after a failed reply
    - unit: reins       # who holds what changed (it only wakes), and stops
      via: events
      stream: reins_events
      types: [reins.hold.changed, reins.reply.stop]
    - unit: subjects    # the held subjects found by id, senders named in the prompt
      via: http
      env: SUBJECTS_URL
      calls: ["GET /subjects", "GET /subjects/{id}"]
    - unit: minds/assistant   # the answer: an AG-UI run, the held model in forwardedProps.modelName
      via: http
      env: MIND_URL
      calls: ["POST /run"]
  infra: [redis]        # the bus: threads_events and reins_events in, driver_events out; waited for at boot

wire: []

config:
  required:
    PROFILES: "<name>=<chat model>,... e.g. fake=fake,glm=glm-4.6: the brains it can be; reins says which subjects each holds"
    REINS_URL: reins' inner port, e.g. http://reins:8088 (GET /holds), never the door
    THREADS_URL: the threads service, e.g. http://threads:8085
    SUBJECTS_URL: the subjects service, e.g. http://subjects:8083
    MIND_URL: the mind's AG-UI run, e.g. http://mind:8088/run
  optional:
    TAIL: "50"              # how many of the thread's last entries the prompt is built from, 1..1000
    GROUP: drivers-model    # its consumer group on threads_events
    CATCHUP: 2m             # on taking a subject's reins, what was said to it this recently and is unanswered is answered
    PORT: "8097"
  secrets: {}
