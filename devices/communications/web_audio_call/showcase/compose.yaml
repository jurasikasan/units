name: web-audio-call-showcase

services:
  redis:
    image: redis:7-alpine

  line:
    build: ..
    environment:
      REDIS_ADDR: redis:6379
      WEBRTC_AUDIO_IN_HOST: line
    depends_on: [redis]

  # A stand-in for the browser: aiortc calls the line with a tone, the line's
  # listen sends that tone to the caller script, audio_in carries a tone back.
  demo:
    image: python:3.12-slim
    depends_on: [line]
    volumes:
      - ./caller.py:/caller.py:ro
    command: ["sh", "-c", "pip install -q --root-user-action=ignore --disable-pip-version-check aiortc==1.9.0 numpy==2.1.3 && python3 -u /caller.py"]
