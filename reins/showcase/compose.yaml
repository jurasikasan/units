name: reins-showcase

# reins, the registry it reads and the journal it writes into, each on its
# own Postgres on a network only it joins, and the bus threads announces its
# appends on; the demo talks to reins as a door would, X-Principal-Id set.
services:
  bus:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  threads-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: threads
      POSTGRES_DB: threads
    networks: [threads-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "threads"]
      interval: 1s
      retries: 30

  threads:
    build: ../../threads
    depends_on:
      threads-db:
        condition: service_healthy
      bus:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://threads:threads@threads-db:5432/threads?sslmode=disable
      REDIS_ADDR: bus:6379
    networks: [default, threads-db]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/ready"]
      interval: 1s
      retries: 30

  subjects-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subjects
      POSTGRES_PASSWORD: subjects
      POSTGRES_DB: subjects
    networks: [subjects-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "subjects"]
      interval: 1s
      retries: 30

  subjects:
    build: ../../subjects
    depends_on:
      subjects-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://subjects:subjects@subjects-db:5432/subjects?sslmode=disable
    networks: [default, subjects-db]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/ready"]
      interval: 1s
      retries: 30

  reins-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reins
      POSTGRES_PASSWORD: reins
      POSTGRES_DB: reins
    networks: [reins-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reins"]
      interval: 1s
      retries: 30

  reins:
    build: ..
    depends_on:
      reins-db:
        condition: service_healthy
      subjects:
        condition: service_healthy
      threads:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reins:reins@reins-db:5432/reins?sslmode=disable
      SUBJECTS_URL: http://subjects:8083
      THREADS_URL: http://threads:8085
      REDIS_ADDR: bus:6379
    networks: [default, reins-db]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/ready"]
      interval: 1s
      retries: 30

  demo:
    image: curlimages/curl:8.11.1
    depends_on:
      reins:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]

networks:
  default:
  subjects-db:
    internal: true
  reins-db:
    internal: true
  threads-db:
    internal: true
