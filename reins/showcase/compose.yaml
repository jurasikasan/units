name: reins-showcase

# reins and the registry it reads, each on its own Postgres on a network only
# it joins; the demo talks to reins as a door would, X-Principal-Id set.
services:
  subjects-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subjects
      POSTGRES_PASSWORD: subjects
      POSTGRES_DB: subjects
    networks: [subjects-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "subjects"]
      interval: 1s
      retries: 30

  subjects:
    build: ../../subjects
    depends_on:
      subjects-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://subjects:subjects@subjects-db:5432/subjects?sslmode=disable
    networks: [default, subjects-db]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/ready"]
      interval: 1s
      retries: 30

  reins-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reins
      POSTGRES_PASSWORD: reins
      POSTGRES_DB: reins
    networks: [reins-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reins"]
      interval: 1s
      retries: 30

  reins:
    build: ..
    depends_on:
      reins-db:
        condition: service_healthy
      subjects:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://reins:reins@reins-db:5432/reins?sslmode=disable
      SUBJECTS_URL: http://subjects:8083
    networks: [default, reins-db]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/ready"]
      interval: 1s
      retries: 30

  demo:
    image: curlimages/curl:8.11.1
    depends_on:
      reins:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]

networks:
  default:
  subjects-db:
    internal: true
  reins-db:
    internal: true
