definitions:
  holds.Brain:
    properties:
      here:
        description: 'Here: the principal asking holds it from the device asking.'
        type: boolean
      kind:
        description: Kind is `principal`, `brain` or `offline`.
        example: principal
        type: string
      principal:
        description: Principal holding it (kind principal).
        example: alice
        type: string
      profile:
        description: 'Profile holding it (kind brain): a driver''s profile.'
        example: fake
        type: string
      since:
        type: string
      you:
        description: 'You: the principal asking holds it.'
        type: boolean
    type: object
  holds.BrainHold:
    properties:
      device:
        type: string
      holder:
        type: string
      profile:
        example: fake
        type: string
      since:
        type: string
      subject:
        type: string
    type: object
  holds.HandRequest:
    properties:
      profile:
        example: fake
        type: string
    type: object
  holds.ReleaseRequest:
    properties:
      profile:
        example: fake
        type: string
    type: object
  holds.Released:
    properties:
      released:
        type: boolean
    type: object
  holds.StopRequest:
    properties:
      subject:
        type: string
    type: object
  stewardship.Change:
    properties:
      bio:
        example: Writes the release notes.
        type: string
      name:
        example: Alice
        type: string
      preferences:
        type: object
    type: object
  stewardship.HandoverRequest:
    properties:
      to:
        example: bob
        type: string
    type: object
  stewardship.Subject:
    properties:
      bio:
        type: string
      current_brain:
        allOf:
        - $ref: '#/definitions/holds.Brain'
        description: |-
          CurrentBrain is who holds its reins now, as the principal asking sees
          it from its device: reins' own, added to what `subjects` sent, never
          written there and never shown to a character.
      id:
        type: string
      name:
        type: string
      nick:
        type: string
      preferences:
        type: object
    type: object
  world.OpenRequest:
    properties:
      as:
        type: string
      with:
        items:
          type: string
        type: array
    type: object
  world.RenameRequest:
    properties:
      as:
        type: string
      name:
        type: string
    type: object
  world.SayRequest:
    properties:
      as:
        type: string
      content:
        items:
          type: object
        type: array
    type: object
  world.Thread:
    properties:
      created_at:
        type: string
      id:
        type: string
      members:
        items:
          type: string
        type: array
      name:
        type: string
      opened_by:
        type: string
      parent:
        type: string
    type: object
host: localhost:8087
info:
  contact: {}
  description: |-
    Where a principal holds the reins of its subjects: which
    subjects an account at the door may look into and take up.
    A principal first seen is given two personas in `subjects`.
    Who holds each subject's reins now (the one wheel): taken
    from a device, handed to a brain, given back.
    Reached only through the door (X-Principal-Id). Own database
    on its own network. The routes tagged inner are on the inner
    port (INTERNAL_PORT, 8088), for drivers, never forwarded by the door.
  title: Reins
  version: "1.0"
paths:
  /brains:
    get:
      description: 'The driver''s profiles, as it says them: names only.'
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "502":
          description: The driver did not answer
          schema:
            type: string
        "503":
          description: No brains here (no BRAINS_URL)
          schema:
            type: string
      summary: The brains a subject can be handed to
      tags:
      - holds
  /health:
    get:
      description: |-
        Answers if the process is serving HTTP at all, and says nothing
        about Postgres or subjects; scripts/stack_version.py reads the version.
      produces:
      - application/json
      responses:
        "200":
          description: status and version
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe and build version
      tags:
      - health
  /holds:
    get:
      description: |-
        On reins' inner port (INTERNAL_PORT), never forwarded by the
        door: no principal. A driver reads it at boot and on each
        reins.hold.changed, and keeps those of its own profiles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/holds.BrainHold'
            type: array
        "502":
          description: The database did not answer
          schema:
            type: string
      summary: Every hold of a brain (inner port)
      tags:
      - inner
  /holds/{id}/release:
    post:
      consumes:
      - application/json
      description: |-
        On reins' inner port, never forwarded by the door. The driver
        whose reply failed lets go: nobody holds the subject when
        brain:<profile> still does, the avatar is offline, and
        reins.hold.changed says so with holder "". When someone else
        holds it now, nothing changes (released false): a late letting
        go never drops another holder. Re-attaching is a steward's.
      parameters:
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      - description: 'the brain letting go: its profile'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/holds.ReleaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/holds.Released'
        "400":
          description: A bad id or body
          schema:
            type: string
        "502":
          description: The database did not answer
          schema:
            type: string
      summary: A brain lets go of its own hold (inner port)
      tags:
      - inner
  /me/stream:
    get:
      description: |-
        Server-sent events. `ready` first, its id the position the stream
        starts after. `entry`: one appended entry (threads' shape) of a
        thread one of the caller's avatars is in, read back from threads
        on its event; its id is the event's id on threads_events, so a
        reconnect with Last-Event-ID (or since=) resumes after it.
        `writing`: a piece of a reply still being written there (never
        journaled, no id). `reset`: the position is no longer on the
        stream; reload what is shown.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: resume after this id
        in: header
        name: Last-Event-ID
        type: string
      - description: resume after this id, when the header cannot be set
        in: query
        name: since
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: the events
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "502":
          description: The bus did not answer
          schema:
            type: string
        "503":
          description: No threads or no bus here
          schema:
            type: string
      summary: Follow the threads the caller's avatars are in
      tags:
      - world
  /me/subjects:
    get:
      description: |-
        The subjects whose reins the principal in X-Principal-Id holds,
        read from `subjects` (deleted ones left out), oldest first. The
        first call for a principal makes what is missing of its two
        personas: nick `<login>` and
        `<login>-assistant`, names empty. A nick taken by
        another subject is never adopted. Each with its
        current_brain as the caller sees it from X-Device-Id.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/stewardship.Subject'
            type: array
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "409":
          description: A persona's nick is taken by another subject
          schema:
            type: string
        "422":
          description: The login cannot become a nick
          schema:
            type: string
        "502":
          description: subjects or the database did not answer
          schema:
            type: string
      summary: The subjects the caller steers
      tags:
      - reins
  /me/threads:
    get:
      description: |-
        Every thread where an avatar the principal steers is a member,
        as `threads` reads it: its name and members. Newest first.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/world.Thread'
            type: array
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "502":
          description: threads or the database did not answer
          schema:
            type: string
        "503":
          description: No threads here
          schema:
            type: string
      summary: The threads the caller's avatars are in
      tags:
      - world
    post:
      consumes:
      - application/json
      description: |-
        A new thread opened by `as`; `as` joins it, then each of `with`
        (a join entry sent by that avatar). Every one of them is an
        avatar the caller steers: inviting another's is a later task.
        Opening is an act of `as`: the caller holds its reins from
        X-Device-Id, else 409.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: the device the caller holds `as` from
        in: header
        name: X-Device-Id
        required: true
        type: string
      - description: who opens it, who joins
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/world.OpenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/world.Thread'
        "400":
          description: A bad body, or no `as`
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer one of them
          schema:
            type: string
        "409":
          description: 'Held by someone else: who'
          schema:
            type: string
        "502":
          description: threads or the database did not answer
          schema:
            type: string
        "503":
          description: No threads here
          schema:
            type: string
      summary: Open a thread as an avatar
      tags:
      - world
  /ready:
    get:
      description: |-
        200 when a ping to Postgres succeeds, 503 when it does not;
        the compose healthcheck asks this one.
      produces:
      - application/json
      responses:
        "200":
          description: status ok
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: status unavailable and the ping error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 'Readiness probe: can this instance reach its Postgres'
      tags:
      - health
  /subjects/{id}:
    get:
      description: |-
        As `subjects` returns it, with its current_brain as the
        caller sees it from X-Device-Id. Only a steward may look.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/stewardship.Subject'
        "400":
          description: A bad id
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer this subject
          schema:
            type: string
        "404":
          description: The caller steers it, but subjects has it no more
          schema:
            type: string
        "502":
          description: subjects or the database did not answer
          schema:
            type: string
      summary: One subject the caller steers
      tags:
      - reins
    patch:
      consumes:
      - application/json
      description: |-
        A field left out is kept. Preferences are merged key by key
        into the stored ones: a key given replaces it, a key given as
        null takes it out, the rest are kept. Written to `subjects`
        whole (its PUT), the nick and every other field as stored. The
        nick is not in the body: it never changes, and a body naming
        it, or any field but these three, is refused.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      - description: what changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stewardship.Change'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/stewardship.Subject'
        "400":
          description: A bad id or body, or preferences that are not an object
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer this subject
          schema:
            type: string
        "404":
          description: The caller steers it, but subjects has it no more
          schema:
            type: string
        "502":
          description: subjects or the database did not answer
          schema:
            type: string
      summary: Change the name, bio or preferences of a subject the caller steers
      tags:
      - reins
  /subjects/{id}/give-back:
    post:
      description: |-
        Nobody holds it: the avatar is offline until a steward takes it
        or hands it to a brain. Any steward may.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: A bad id
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer this subject
          schema:
            type: string
        "502":
          description: The database did not answer
          schema:
            type: string
      summary: Give the reins of a subject back, to nobody
      tags:
      - holds
  /subjects/{id}/hand:
    post:
      consumes:
      - application/json
      description: |-
        A brain is a driver's profile (GET /brains): who moves into the
        avatar and thinks for it. The subject's context stays one: a
        brain builds it from the journal. Any steward may.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      - description: the profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/holds.HandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/holds.Brain'
        "400":
          description: A bad id or body
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer this subject
          schema:
            type: string
        "422":
          description: No brain by that profile
          schema:
            type: string
        "502":
          description: The database or the driver did not answer
          schema:
            type: string
        "503":
          description: No brains here (no BRAINS_URL)
          schema:
            type: string
      summary: Hand the reins of a subject to a brain
      tags:
      - holds
  /subjects/{id}/handover:
    post:
      consumes:
      - application/json
      description: |-
        Only a current steward may. The caller stops steering the
        subject and `to` starts. Nothing is written to `subjects` or
        `threads`: who steers a subject is not a world event.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      - description: who takes the reins
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stewardship.HandoverRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: A bad id or body, or `to` empty or the caller
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer this subject
          schema:
            type: string
        "500":
          description: The database failed
          schema:
            type: string
      summary: Hand the reins of a subject to another principal
      tags:
      - reins
  /subjects/{id}/take:
    post:
      description: |-
        The caller holds the subject from the device it names
        (X-Device-Id): what it writes as that avatar is its. Any
        steward may, from whoever holds it now (a brain, another
        steward, another device); the former holder learns it on its
        stream. The hold lapses when the device's stream has been gone
        longer than HOLD_GRACE. The subject's current_brain as the caller sees it.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: the device it holds from
        in: header
        name: X-Device-Id
        required: true
        type: string
      - description: subject id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/holds.Brain'
        "400":
          description: A bad id, or no device
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer this subject
          schema:
            type: string
        "502":
          description: The database did not answer
          schema:
            type: string
      summary: Take the reins of a subject, from this device
      tags:
      - holds
  /threads/{id}:
    delete:
      description: |-
        The thread, its entries and its children, as threads deletes
        them: out of the world, for everyone in it. Whoever sees the
        thread may (one of the caller's avatars is a member); no reins
        are needed and nobody is told. What points at it from elsewhere
        (an attachment's url, a memory of it) is left pointing at nothing.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: thread id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: deleted
        "400":
          description: A bad id
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: None of the caller's avatars is in the thread
          schema:
            type: string
        "404":
          description: No such thread
          schema:
            type: string
        "502":
          description: threads or the database did not answer
          schema:
            type: string
        "503":
          description: No threads here
          schema:
            type: string
      summary: Delete a thread for good
      tags:
      - world
    patch:
      consumes:
      - application/json
      description: |-
        An update entry sent by `as`, carrying the new name: an act in
        the thread like saying something, seen by everyone in it. `as`
        must be an avatar the caller steers, whose reins it holds from
        X-Device-Id (else 409), and a member of the thread. The name is
        trimmed, 1 to 200 characters. The entry as threads stored it.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: the device the caller holds `as` from
        in: header
        name: X-Device-Id
        required: true
        type: string
      - description: thread id
        in: path
        name: id
        required: true
        type: string
      - description: who renames it, to what
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/world.RenameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the update entry
          schema:
            type: object
        "400":
          description: A bad body, no `as`, or an empty or too long name
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer `as`, or `as` is not a member
          schema:
            type: string
        "404":
          description: No such thread
          schema:
            type: string
        "409":
          description: 'Held by someone else: who'
          schema:
            type: string
        "502":
          description: threads or the database did not answer
          schema:
            type: string
        "503":
          description: No threads here
          schema:
            type: string
      summary: Rename a thread as an avatar
      tags:
      - world
  /threads/{id}/entries:
    get:
      description: |-
        As threads answers it, oldest first: after={seq}, before={seq}
        or tail=true, and limit. Every entry, whoever sent it: a watcher
        sees the channel itself.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: thread id
        in: path
        name: id
        required: true
        type: string
      - description: the entries after this seq
        in: query
        name: after
        type: integer
      - description: the limit entries before this seq
        in: query
        name: before
        type: integer
      - description: the last limit entries
        in: query
        name: tail
        type: boolean
      - description: 1..1000, 100 by default
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: entries
          schema:
            items:
              type: object
            type: array
        "400":
          description: A bad id or query
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: None of the caller's avatars is in the thread
          schema:
            type: string
        "404":
          description: No such thread
          schema:
            type: string
        "502":
          description: threads or the database did not answer
          schema:
            type: string
        "503":
          description: No threads here
          schema:
            type: string
      summary: Read a thread the caller's avatars are in
      tags:
      - world
    post:
      consumes:
      - application/json
      description: |-
        A create entry sent by `as`, its content as threads takes it
        (text, image, file, audio… blocks; threads' CONTRACT.md). `as`
        must be an avatar the caller steers, whose reins it holds from
        X-Device-Id (else 409, "held by <holder>"), and a member of the
        thread. The entry as threads stored it, seq and all.
      parameters:
      - description: who is asking, as the door sets it
        in: header
        name: X-Principal-Id
        required: true
        type: string
      - description: the device the caller holds `as` from
        in: header
        name: X-Device-Id
        required: true
        type: string
      - description: thread id
        in: path
        name: id
        required: true
        type: string
      - description: who says it, what
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/world.SayRequest'
      produces:
      - application/json
      responses:
        "201":
          description: the entry
          schema:
            type: object
        "400":
          description: A bad body, or content threads refuses (its words)
          schema:
            type: string
        "401":
          description: No X-Principal-Id
          schema:
            type: string
        "403":
          description: The caller does not steer `as`, or `as` is not a member
          schema:
            type: string
        "404":
          description: No such thread
          schema:
            type: string
        "409":
          description: 'Held by someone else: who'
