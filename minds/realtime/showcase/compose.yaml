# minds/realtime on its own, with real engines on CPU: piper says a
# question, the call takes it in OpenAI's Realtime schema, hearing (energy
# detector) has whisper transcribe it, a model that echoes answers, speaking
# says the answer with piper. Then the question again, over the answer.
#
#   docker compose up --build --exit-code-from demo demo
name: realtime-showcase

services:
  redis:
    image: redis:7-alpine

  piper:
    build: ../../../engines/tts/piper

  whisper:
    build: ../../../engines/stt/whisper
    environment:
      WHISPER_MODEL: base
      WHISPER_VAD_FILTER: "false"
    volumes: [hf-cache:/root/.cache/huggingface]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      start_period: 300s

  model:
    image: python:3.12-alpine
    volumes: [./echo_model.py:/echo_model.py:ro]
    command: [python3, -u, /echo_model.py]

  hearing:
    build: ../../../senses/hearing
    environment:
      REDIS_ADDR: redis:6379
      STT_URL: http://whisper:8001/v1
      STT_MODEL: whisper
      HEARING_VAD: energy
      AUDIO_IN_HOST: hearing
    depends_on:
      redis: {condition: service_started}
      whisper: {condition: service_healthy}

  speaking:
    build: ../../../abilities/speaking
    environment:
      REDIS_ADDR: redis:6379
      TTS_URL: http://piper:8000/v1

  realtime:
    build: ..
    environment:
      REDIS_ADDR: redis:6379
      LLM_URL: http://model:8000
      LLM_MODEL: echo
      VOICE: piper_lessac
      SPEECH_LANGUAGE: en
      AUDIO_IN_HOST: realtime
    depends_on:
      hearing: {condition: service_started}
      speaking: {condition: service_started}
      model: {condition: service_started}

  demo:
    image: python:3.12-alpine
    volumes: [./demo.py:/demo.py:ro]
    command: [sh, -c, "pip install -q websockets==15.0.1 && python3 -u -W ignore /demo.py"]
    depends_on:
      realtime: {condition: service_healthy}
      piper: {condition: service_healthy}

volumes:
  hf-cache:
