# Manifest: what a reader outside the unit reads instead of its code.
# Meaning lives in CONTRACT.md; this is what a validator and an assembler read.

unit: minds/realtime
kind: mind              # decides: takes the call, answers, stops when talked over
summary: "A call in OpenAI's Realtime schema made of organs: hearing finds the caller's utterances and words, a chat model answers, speaking says it; the schema's whole event set, barge-in and truncate included."
contract: CONTRACT.md
maturity: probe

provides:
  rest:
    port: 8080
    routes:
      - "GET /v1/realtime"   # OpenAI's Realtime (GA), a WebSocket; ?model= is shown in the session, the chat model is LLM_MODEL
  health: GET :8080/health

consumes:
  units:
    - unit: senses/hearing
      via: mcp
      env: HEARING_URL
      tools: [open, close]
    - unit: senses/hearing
      via: events
      stream: hearing_events
      types:
        - speechrecog.start-of-input
        - speechrecog.recognition-complete
        - speechrecog.session-closed
    - unit: abilities/speaking
      via: mcp
      env: SPEAKING_URL
      tools: [open, speak, stop, barge_in_occurred, close]
    - unit: abilities/speaking
      via: events
      stream: speech_events
      types:
        - speechsynth.speak-complete
        - speechsynth.session-closed
    - unit: litellm      # or any OpenAI-shaped chat endpoint
      via: http
      env: LLM_URL
      calls: ["POST /v1/chat/completions"]
  infra: [redis]         # REDIS_ADDR, through units/shared/redis: the organs' events

# speaking's sound comes back here, one UDP port per call, box-internal.
wire: []                 # AUDIO_IN_PORT_MIN..MAX (default 46000-46099) is reached on the box network only

config:
  required:
    LLM_URL: an OpenAI-shaped chat endpoint without /v1, e.g. http://litellm:4000
    LLM_MODEL: the chat model that answers
    VOICE: speaking's voice, <engine>_<voice> (piper_irina)
  optional:
    PORT: "8080"
    LLM_KEY: ""                       # the endpoint's bearer
    SYSTEM_PROMPT: ""                 # the instructions when the session gives none
    SPEECH_LANGUAGE: ""               # hearing's hint, ISO 639-1; empty lets STT guess
    HEARING_URL: http://hearing:8080/mcp
    SPEAKING_URL: http://speaking:8080/
    AUDIO_IN_HOST: realtime           # the name speaking reaches this mind by
    AUDIO_IN_PORT_MIN: "46000"
    AUDIO_IN_PORT_MAX: "46099"
    MAX_CALLS: "4"
  secrets: {}
