# Manifest — what a reader outside minds/assistant reads instead of its code.
# Meaning lives in CONTRACT.md; this is what a validator and an assembler read.

unit: minds/assistant
kind: mind              # decides what is said; organs and stores decide nothing
summary: A chat assistant. An AG-UI run in (the model picked among those it offers), a model's answer streamed out as AG-UI events, tools of MCP servers called on the way; OpenAI's audio API handed on to the same endpoint, its Realtime API (a call) relayed there; keeps nothing.
contract: CONTRACT.md
maturity: probe

provides:
  rest:
    port: 8088
    routes:
      - "POST /run"     # AG-UI: RunAgentInput in (at most 16 MB, attachments inline; forwardedProps.modelName picks the model), an event stream (SSE) out
      - "GET /v1/models"  # OpenAI's: the models a run may pick, LLM_MODEL first
      - "POST /v1/audio/transcriptions"   # OpenAI's: a sound in (multipart, at most 25 MB), its text out; served when STT_MODEL is set
      - "POST /v1/audio/speech"           # OpenAI's: words in (JSON), a sound out, streamed; served when TTS_MODEL is set
      - "GET /v1/realtime"                # OpenAI's Realtime: a WebSocket, relayed unchanged, each event logged; served when REALTIME_MODEL is set
  health: GET :8088/health

consumes:
  units:
    - unit: litellm     # or any OpenAI-shaped chat endpoint
      via: http
      env: LLM_URL
      calls: ["POST /v1/chat/completions", "GET /v1/models", "GET /v1/model/info", "POST /v1/audio/transcriptions", "POST /v1/audio/speech", "GET /v1/realtime"]   # models: what may be picked; model/info: LiteLLM's, what a model takes and its mode; both optional. audio: only when STT_MODEL / TTS_MODEL are set; realtime (WebSocket) only when REALTIME_MODEL is
    - unit: any MCP server   # MCP 2026-07-28, Streamable HTTP; whichever MCP_SERVERS names
      via: mcp
      env: MCP_SERVERS
      tools: []              # whatever each lists; none is assumed
  gate: X-Principal-Id  # who is asking; the gate, or any door, sets it

wire: []

config:
  required:
    LLM_URL: an OpenAI-shaped endpoint without /v1, e.g. http://litellm:4000
    LLM_MODEL: the model name to ask when a run picks none
  optional:
    SYSTEM_PROMPT: first in every prompt
    MCP_SERVERS: "MCP servers whose tools the model may call, name=url,name=url (Streamable HTTP endpoints)"
    MAX_TOOL_STEPS: "how many times a run asks the model while it keeps calling tools; 8"
    LLM_IDLE_TIMEOUT: "how long a model call may go without a byte before the run ends with RUN_ERROR (model_timed_out); a Go duration, 5m"
    STT_MODEL: "the model asked to transcribe; POST /v1/audio/transcriptions is served only when set"
    TTS_MODEL: "the model asked to speak; POST /v1/audio/speech is served only when set"
    TTS_VOICE: "the voice when a speech request names none"
    REALTIME_MODEL: "the model a call is relayed to; GET /v1/realtime is served only when set"
    PORT: "8088"
  secrets:
    LLM_API_KEY: sent as a Bearer token, when the endpoint asks for one
