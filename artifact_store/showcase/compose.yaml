name: artifact-store-showcase

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "store"]
      interval: 1s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: showcase
      MINIO_ROOT_PASSWORD: showcase
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      retries: 30

  artifact_store:
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://store:store@postgres:5432/store?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_ID: showcase
      MINIO_SECRET_ACCESS_KEY: showcase
      RETENTION: docs=90d,archive=never
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/health"]
      interval: 1s
      retries: 30

  demo:
    image: curlimages/curl:8.11.1
    depends_on:
      artifact_store:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]
