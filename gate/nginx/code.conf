# Where a program's authorization code lands, in
# `location = /gate/code { include …/code.conf; }`: the address the
# programs' client sends the person back to. Authelia posts the code here
# (form_post); the page shows it to the person, who pastes it to the program.
# Only a session opens it, as a page.
auth_request /internal/gate/authz-session;
auth_request_set $gate_principal $upstream_http_remote_user;
auth_request_set $gate_login $upstream_http_location;
error_page 401 =302 $gate_login;
# nginx's `return` comes before a body is read, so the form is read by
# mirroring it to a location that drops it; then, with no file here to serve,
# the request falls to @gate_code, which answers from $request_body.
client_max_body_size 16k;
client_body_buffer_size 16k;
client_body_in_single_buffer on;
mirror /internal/gate/void;
mirror_request_body on;
root /var/empty/gate;
log_not_found off;
error_page 404 405 = @gate_code;
