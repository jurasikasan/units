# Once per server block: where nginx asks gate whether a request may pass.
# gate is named through a variable, so nginx looks it up through the site's
# `resolver` as it goes, and a recreated gate is found at its new address.
location = /internal/gate/authz {
    internal;
    set $gate_upstream gate:9091;
    proxy_pass http://$gate_upstream/auth/api/authz/auth-request;
    # The asking is a subrequest, and nginx holds the request's
    # Content-Length to this location's limit too, 1 MB unless said: a
    # larger body got 413 here, which auth_request turns into 500. The body
    # does not come here; the location that serves the request limits it.
    client_max_body_size 0;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Who passed, for userinfo.conf: reached only from there, once the session is
# checked. A value that could break the JSON is refused, not escaped: gate-user
# makes none.
location @gate_userinfo {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    set $gate_who "$gate_principal$gate_name$gate_email";
    if ($gate_principal = "") { return 401; }
    if ($gate_who ~ "[\x00-\x1f\x22\x5c]") { return 500; }
    return 200 '{"sub":"$gate_principal","preferred_username":"$gate_principal","name":"$gate_name","email":"$gate_email","end_session_endpoint":"/auth/logout"}\n';
}
