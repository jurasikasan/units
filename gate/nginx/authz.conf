# Once per server block: where nginx asks gate whether a request may pass.
# gate is named through a variable, so nginx looks it up through the site's
# `resolver` as it goes, and a recreated gate is found at its new address.
location = /internal/gate/authz {
    internal;
    set $gate_upstream gate:9091;
    proxy_pass http://$gate_upstream/auth/api/authz/auth-request;
    # The asking is a subrequest, and nginx holds the request's
    # Content-Length to this location's limit too, 1 MB unless said: a
    # larger body got 413 here, which auth_request turns into 500. The body
    # does not come here; the location that serves the request limits it.
    client_max_body_size 0;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# The same question for a person's pages, asked without the request's
# Authorization: a page opens with a session only, never with a program's
# credentials.
location = /internal/gate/authz-session {
    internal;
    set $gate_upstream gate:9091;
    proxy_pass http://$gate_upstream/auth/api/authz/auth-request;
    client_max_body_size 0;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Who passed, for userinfo.conf: reached only from there, once the session is
# checked. A value that could break the JSON is refused, not escaped: gate-user
# makes none.
location @gate_userinfo {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    set $gate_who "$gate_principal$gate_name$gate_email";
    if ($gate_principal = "") { return 401; }
    if ($gate_who ~ "[\x00-\x1f\x22\x5c]") { return 500; }
    return 200 '{"sub":"$gate_principal","preferred_username":"$gate_principal","name":"$gate_name","email":"$gate_email","end_session_endpoint":"/auth/logout"}\n';
}

# For code.conf: where the read form is mirrored to, and dropped.
location = /internal/gate/void {
    internal;
    return 204;
}

# The page that shows a program's authorization code, for code.conf: reached
# once the session is checked and the posted form is read, so $request_body
# holds it. Only a code made of the characters Authelia uses is shown.
location @gate_code {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
    set $gate_code "";
    if ($request_body ~ "(^|&)code=([A-Za-z0-9._~-]+)(&|$)") { set $gate_code $2; }
    if ($gate_code = "") { return 400 '<!doctype html><title>no code</title><p>No code came here. Start again from the address the program printed.</p>\n'; }
    return 200 '<!doctype html>\n<title>a program\'s code</title>\n<style>body{font-family:sans-serif;max-width:40em;margin:3em auto;padding:0 1em}code{display:block;word-break:break-all;font-size:1.2em;padding:1em;background:#eee;color:#000}</style>\n<p>$gate_principal let the program in. Paste this code to it:</p>\n<code id="code">$gate_code</code>\n<p>It is good for ten minutes and once. Then <a href="/auth/logout">log out</a> here.</p>\n';
}
