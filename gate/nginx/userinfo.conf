# Who is logged in, as OpenID Connect's UserInfo, for the person's own page:
# `location = /api/v1/userinfo { include …/userinfo.conf; }`. Without a
# session, 401. `end_session_endpoint` (OIDC's name, from its discovery) is
# where logging out happens. The answer is made in authz.conf's
# @gate_userinfo, after the session is checked: nginx's `return` here would
# come before the check.
auth_request /internal/gate/authz-session;
auth_request_set $gate_principal $upstream_http_remote_user;
auth_request_set $gate_name $upstream_http_remote_name;
auth_request_set $gate_email $upstream_http_remote_email;
try_files /.gate-userinfo @gate_userinfo;
