# Pages: a request without a session goes to the login page and comes back.
auth_request /internal/gate/authz;
auth_request_set $gate_principal $upstream_http_remote_user;
proxy_set_header X-Principal-Id $gate_principal;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
auth_request_set $gate_login $upstream_http_location;
error_page 401 =302 $gate_login;
