server {
    listen 443 ssl;
    server_name gate.localhost;
    ssl_certificate     /certs/public.crt;
    ssl_certificate_key /certs/private.pem;

    include /etc/nginx/gate/authz.conf;

    location /auth {
        include /etc/nginx/gate/portal.conf;
    }
    location /api/ {
        include /etc/nginx/gate/api.conf;
        proxy_pass http://hello;
    }
    location / {
        include /etc/nginx/gate/page.conf;
        proxy_pass http://hello;
    }
}
