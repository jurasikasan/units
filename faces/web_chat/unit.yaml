# Manifest — what a reader outside faces/web_chat reads instead of its code.
# A face shows; it decides nothing and keeps nothing.

unit: faces/web_chat
kind: face
summary: A chat page that speaks AG-UI to whatever answers at /api/run, with a mic and read-aloud through OpenAI's audio API at /api/v1/audio; static files, no server, the conversation kept in the page.
contract: README.md
maturity: probe

provides:
  http:
    port: 80            # nginx serving the built files; any static host will do

consumes:
  agui: POST /api/run   # any AG-UI agent, on the same origin
  http:                 # OpenAI's audio API, on the same origin; each shows only when answered (HEAD not 404)
    - POST /api/v1/audio/transcriptions   # the mic: a recording (WebM/Opus, Ogg or MP4, as the browser makes) in, {text} out
    - POST /api/v1/audio/speech           # read aloud: {input} in, a sound the browser plays out

wire: []

config: {}
