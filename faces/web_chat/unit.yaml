# Manifest — what a reader outside faces/web_chat reads instead of its code.
# A face shows; it decides nothing and keeps nothing.

unit: faces/web_chat
kind: face
summary: A chat page that speaks AG-UI to whatever answers at /api/run, its chats in a sidebar (kept in the page), settings with the person's avatars from reins (name, bio, and the same body on each among the models at /api/v1/models — ear, mouth, voice), which the mic, read-aloud and a call are asked with, the chat model picked in the composer, with a mic and read-aloud through OpenAI's audio API at /api/v1/audio and a call through its Realtime API at /api/v1/realtime, who is logged in and a log-out from OIDC UserInfo at /api/v1/userinfo; static files, no server, the conversation kept in the page.
contract: README.md
maturity: probe

provides:
  http:
    port: 80            # nginx serving the built files; any static host will do

consumes:
  agui: POST /api/run   # any AG-UI agent, on the same origin; the composer's chat model in forwardedProps.modelName
  http:                 # OpenAI's API, on the same origin; each shows only when answered
    - GET /api/v1/models                  # what the settings offer: OpenAI's list with mode and voices (the agent's fields), each mode's first the agent's own
    - POST /api/v1/audio/transcriptions   # the mic (HEAD not 404), model my avatar's ear: a recording (WebM/Opus, Ogg or MP4, as the browser makes) in, {text} out
    - POST /api/v1/audio/speech           # read aloud, model and voice the other avatar's mouth and voice: {input} in, a sound the browser plays out
    - GET /api/v1/realtime                # a call: OpenAI's Realtime schema over a WebSocket, PCM16 24 kHz both ways
    - GET /api/v1/userinfo                # who is logged in, at the sidebar's foot: OIDC UserInfo claims, end_session_endpoint for log out
    - GET /api/reins/me/subjects          # reins: the avatars the person steers; the settings show only when answered
    - PATCH /api/reins/subjects/{id}      # reins: a change of an avatar's name, bio or preferences (keys in reins' CONTRACT.md)

wire: []

config: {}
