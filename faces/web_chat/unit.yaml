# Manifest — what a reader outside faces/web_chat reads instead of its code.
# A face shows; it decides nothing and keeps nothing.

unit: faces/web_chat
kind: face
summary: A chat page whose chats are threads read and written through reins - what the person says appended as the avatar whose reins it holds from this browser (a device id), who holds each avatar shown (you here, another device, a brain, offline) with take, give back, hand to a brain and Stop for a brain's reply, everything said in their threads coming back on one SSE stream, replies being written shown as they grow - with settings for the person's avatars from reins (name, bio, and the same body on each among the models at /api/v1/models - ear, mouth, voice), which the mic, read-aloud and a call are asked with, a mic and read-aloud through OpenAI's audio API at /api/v1/audio and a call through its Realtime API at /api/v1/realtime (its transcripts not journaled yet), who is logged in and a log-out from OIDC UserInfo at /api/v1/userinfo; static files, no server, nothing kept in the page.
contract: README.md
maturity: probe

provides:
  http:
    port: 80            # nginx serving the built files; any static host will do

consumes:
  http:                 # OpenAI's API, on the same origin; each shows only when answered
    - GET /api/v1/models                  # what the settings offer: OpenAI's list with mode and voices (the agent's fields), each mode's first the agent's own
    - POST /api/v1/audio/transcriptions   # the mic (HEAD not 404), model my avatar's ear: a recording (WebM/Opus, Ogg or MP4, as the browser makes) in, {text} out
    - POST /api/v1/audio/speech           # read aloud, model and voice the other avatar's mouth and voice: {input} in, a sound the browser plays out
    - GET /api/v1/realtime                # a call: OpenAI's Realtime schema over a WebSocket, PCM16 24 kHz both ways
    - GET /api/v1/userinfo                # who is logged in, at the sidebar's foot: OIDC UserInfo claims, end_session_endpoint for log out
    - GET /api/reins/me/subjects          # reins: the avatars the person steers; the settings show only when answered
    - PATCH /api/reins/subjects/{id}      # reins: a change of an avatar's name, bio or preferences (keys in reins' CONTRACT.md)
    - GET /api/reins/me/threads           # reins: the chats, threads the person's avatars are in
    - POST /api/reins/me/threads          # reins: a new chat, the avatar held here with the first other one
    - GET /api/reins/threads/{id}/entries     # reins: a chat read, page by page
    - POST /api/reins/threads/{id}/entries    # reins: what the person says, as the avatar held here; pictures and files as data: URLs with sha256
    - GET /api/reins/me/stream            # reins: SSE, entry (resumed by Last-Event-ID), writing and hold; ?device= this browser
    - POST /api/reins/subjects/{id}/take       # reins: an avatar's reins, from this device (X-Device-Id)
    - POST /api/reins/subjects/{id}/give-back  # reins: to nobody
    - POST /api/reins/subjects/{id}/hand       # reins: to a brain, {"profile"}
    - GET /api/reins/brains               # reins: the profiles to hand to
    - POST /api/reins/threads/{id}/stop   # reins: a brain's reply stopped, {"subject"}

wire: []

config: {}
