# What a gate would be in front of a real site: the page at /, reins at
# /api/reins/, everyone let in as alice (a door sets X-Principal-Id; this one
# knows nobody else).
server {
    listen 80;
    location /api/reins/ {
        proxy_set_header X-Principal-Id alice;
        rewrite ^/api/reins/(.*)$ /$1 break;
        proxy_pass http://reins:8087;
        client_max_body_size 16m;  # pictures and files go inline, as data: URLs
        proxy_buffering off;       # the stream, event by event
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://face;
    }
}
