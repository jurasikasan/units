# What a gate would be in front of a real site: the page at /, the agent at /api/.
server {
    listen 80;
    location /api/ {
        proxy_pass http://agent:8089;
        client_max_body_size 16m;  # attachments go inline with the run
        proxy_buffering off;
    }
    location / {
        proxy_pass http://face;
    }
}
