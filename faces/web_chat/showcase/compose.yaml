name: web-chat-showcase

services:
  # The page, as built by its Dockerfile.
  face:
    build: ..
    image: units-faces-web-chat:local

  # Any AG-UI agent will do; this one echoes, so the face is shown on its own.
  agent:
    image: python:3.13-alpine
    command: ["python3", "-u", "/echo_agent.py"]
    volumes:
      - ./echo_agent.py:/echo_agent.py:ro
    ports:
      - 127.0.0.1:${AGENT_PORT:-8089}:8089   # for `npm run dev`

  front:
    image: nginx:1.30-alpine
    volumes:
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 127.0.0.1:${WEB_CHAT_PORT:-8080}:80
    depends_on: [face, agent]

  demo:
    image: curlimages/curl:8.11.1
    profiles: [demo]
    depends_on: [front]
    volumes:
      - ./demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]
