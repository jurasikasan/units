# The lab's SearXNG, asked only by the web tool (tool-web), never reached
# from outside: its defaults, plus the json format the tool reads, without
# the limiter (it guards a public instance from bots) and the image proxy.
use_default_settings: true
server:
  limiter: false
  image_proxy: false
  public_instance: false
search:
  formats: [html, json]
