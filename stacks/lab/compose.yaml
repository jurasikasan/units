name: lab

x-gate: &gate
  build: ../../gate
  image: units-gate:local
  environment:
    GATE_DOMAIN: ${LAB_DOMAIN}
    GATE_URL: ${LAB_URL}
    GATE_REDIS_HOST: redis
    GATE_SMTP_ADDRESS: ${LAB_SMTP_ADDRESS}
    GATE_SMTP_SENDER: ${LAB_SMTP_SENDER}
    GATE_SMTP_USERNAME: ${LAB_SMTP_USERNAME:-}
    GATE_SMTP_PASSWORD: ${LAB_SMTP_PASSWORD:-}
    AUTHELIA_NOTIFIER_SMTP_TLS_SKIP_VERIFY: ${LAB_SMTP_SKIP_VERIFY:-false}
  volumes:
    - data:/data
    - secrets:/secrets

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      gate:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
      face:
        condition: service_started
      mind:
        condition: service_healthy
      reins:
        condition: service_healthy
      driver:
        condition: service_healthy
    ports:
      - ${LAB_BIND}:${LAB_PORT}:443
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
    volumes:
      - ./site.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../gate/nginx:/etc/nginx/gate:ro
      - ${LAB_CERTS}:/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 1s
      retries: 30

  gate:
    <<: *gate
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 2s
      retries: 60

  # The first account, when there is none; the program's, when it is missing.
  seed:
    <<: *gate
    environment:
      LAB_FIRST_USER: ${LAB_FIRST_USER:-}
      LAB_FIRST_EMAIL: ${LAB_FIRST_EMAIL:-}
      LAB_FIRST_PASSWORD: ${LAB_FIRST_PASSWORD:-}
      LAB_PROGRAM: ${LAB_PROGRAM:-}
      LAB_PROGRAM_PASSWORD: ${LAB_PROGRAM_PASSWORD:-}
      LAB_DOMAIN: ${LAB_DOMAIN}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /data/users.yml ]; then
          [ -n "$$LAB_FIRST_PASSWORD" ] || { echo "no accounts and no LAB_FIRST_PASSWORD"; exit 1; }
          printf '%s\n' "$$LAB_FIRST_PASSWORD" | gate-user add "$$LAB_FIRST_USER" "$$LAB_FIRST_EMAIL"
        fi
        [ -n "$$LAB_PROGRAM" ] || exit 0
        grep -q "^  $$LAB_PROGRAM:\$$" /data/users.yml && exit 0
        [ -n "$$LAB_PROGRAM_PASSWORD" ] || { echo "no LAB_PROGRAM_PASSWORD for $$LAB_PROGRAM"; exit 1; }
        printf '%s\n' "$$LAB_PROGRAM_PASSWORD" | gate-user add "$$LAB_PROGRAM" "$$LAB_PROGRAM@$$LAB_DOMAIN"
    restart: "no"

  # A self-signed certificate when LAB_CERTS has none; a real one is left alone.
  certs:
    <<: *gate
    entrypoint:
      - sh
      - -c
      - |
        [ -s /certs/fullchain.pem ] && exit 0
        mkdir -p /tmp/c
        authelia crypto certificate rsa generate --common-name "$$LAB_DOMAIN" --sans "$$LAB_DOMAIN" --directory /tmp/c
        cp /tmp/c/public.crt /certs/fullchain.pem
        cp /tmp/c/private.pem /certs/privkey.pem
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
    volumes:
      - ${LAB_CERTS}:/certs
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.29
    profiles: [mailpit]
    restart: unless-stopped
    environment:
      MP_SMTP_TLS_CERT: sans:mailpit
      MP_SMTP_TLS_KEY: sans:mailpit
    ports:
      - 127.0.0.1:${LAB_MAILPIT_PORT:-8025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      retries: 30

  # The page: static files whose chats are threads, through reins.
  face:
    build: ../../faces/web_chat
    image: units-faces-web-chat:local
    restart: unless-stopped

  # The mind behind /api/: AG-UI in, a model's answer out.
  mind:
    build: ../../minds/assistant
    image: units-minds-assistant:local
    restart: unless-stopped
    environment:
      LLM_URL: http://litellm:4000
      LLM_MODEL: ${LAB_LLM_MODEL:-fake}
      LLM_API_KEY: ${LAB_LLM_KEY}
      SYSTEM_PROMPT: ${LAB_SYSTEM_PROMPT:-}
      MCP_SERVERS: ${LAB_MCP_SERVERS:-}
      STT_MODEL: ${LAB_STT_MODEL:-}
      TTS_MODEL: ${LAB_TTS_MODEL:-}
      TTS_VOICE: ${LAB_TTS_VOICE:-}
      REALTIME_MODEL: ${LAB_REALTIME_MODEL:-}
    depends_on:
      litellm:
        condition: service_healthy
      tool-images:
        condition: service_started
      everything:
        condition: service_healthy
        required: false

  # Brains: a chat model holding avatars' reins as one of its profiles
  # (LAB_PROFILES, <name>=<model>,…), whichever reins says each holds. Woken
  # when someone else says something in a thread its avatar is in, it has
  # the mind answer with the profile's model and says the answer there as
  # the avatar; the pieces go on the bus (driver_events) for reins to relay
  # as they come. It reads whom its profiles hold from reins' inner port.
  driver:
    build: ../../drivers/model
    image: units-drivers-model:local
    restart: unless-stopped
    environment:
      PROFILES: ${LAB_PROFILES:-fake=fake,fake-text=fake-text,chat=chat}
      REINS_URL: http://reins:8088
      REDIS_ADDR: bus:6379
      THREADS_URL: http://threads:8085
      SUBJECTS_URL: http://subjects:8083
      MIND_URL: http://mind:8088/run
    depends_on:
      bus: {condition: service_healthy}
      threads: {condition: service_healthy}
      subjects: {condition: service_healthy}
      mind: {condition: service_healthy}
      reins: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8097/ready"]
      interval: 1s
      retries: 30

  # Who exists (subjects) and which of them a principal steers (reins,
  # behind /api/reins/): a principal first seen is given <login> and
  # <login>-assistant. reins is also the face's door into the world: it
  # writes into threads as an avatar the principal steers, and streams the
  # threads its avatars are in, following the bus. Each on its own Postgres,
  # on a network only it joins.
  subjects:
    build: ../../subjects
    image: units-subjects:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://subjects:subjects@subjects-db:5432/subjects?sslmode=disable
    networks: [default, subjects-db]
    depends_on:
      subjects-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/ready"]
      interval: 1s
      retries: 30
  # What happened where: threads as journals, each append announced on the
  # bus (threads_events) for whoever follows them. Nobody reaches it from
  # outside: reins is the face's door into it.
  threads:
    build: ../../threads
    image: units-threads:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://threads:threads@threads-db:5432/threads?sslmode=disable
      REDIS_ADDR: bus:6379
    networks: [default, threads-db]
    depends_on:
      threads-db:
        condition: service_healthy
      bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/ready"]
      interval: 1s
      retries: 30
  threads-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: threads
      POSTGRES_PASSWORD: threads
      POSTGRES_DB: threads
    networks: [threads-db]
    volumes:
      - threads-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "threads"]
      interval: 1s
      retries: 30
  subjects-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subjects
      POSTGRES_PASSWORD: subjects
      POSTGRES_DB: subjects
    networks: [subjects-db]
    volumes:
      - subjects-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "subjects"]
      interval: 1s
      retries: 30
  reins:
    build: ../../reins
    image: units-reins:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://reins:reins@reins-db:5432/reins?sslmode=disable
      SUBJECTS_URL: http://subjects:8083
      THREADS_URL: http://threads:8085
      REDIS_ADDR: bus:6379
      # Who holds the reins: a principal's <login>-assistant is handed to
      # this profile at its first visit; the profiles to hand to are the
      # driver's; a page gone this long lets go of what it held.
      DEFAULT_BRAIN: ${LAB_DEFAULT_BRAIN:-${LAB_LLM_MODEL:-fake}}
      BRAINS_URL: http://driver:8097
      HOLD_GRACE: ${LAB_HOLD_GRACE:-2m}
    networks: [default, reins-db]
    depends_on:
      reins-db:
        condition: service_healthy
      subjects:
        condition: service_healthy
      threads:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/ready"]
      interval: 1s
      retries: 30
  reins-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reins
      POSTGRES_PASSWORD: reins
      POSTGRES_DB: reins
    networks: [reins-db]
    volumes:
      - reins-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reins"]
      interval: 1s
      retries: 30

  # A tool that draws (tools/images): its picture is the tool's, shown on
  # the call's card in the page. In LAB_MCP_SERVERS as `images`, so the
  # model sees images__draw. It asks LiteLLM's LAB_IMAGES_MODEL
  # (fake-images by default: a red circle, no cloud; images and
  # images-fast draw at Cloudflare under the engines profile).
  tool-images:
    build: ../../tools/images
    image: units-tools-images:local
    restart: unless-stopped
    environment:
      IMAGES_URL: http://litellm:4000/v1
      IMAGES_API_KEY: ${LAB_LLM_KEY}
      IMAGES_MODEL: ${LAB_IMAGES_MODEL:-fake-images}
      IMAGES_FAST_MODEL: ${LAB_IMAGES_FAST_MODEL:-}

  # Tools for the model to try: MCP's own reference server
  # (everything/Dockerfile), under its profile; check.sh's e2e uses it.
  everything:
    build: ./everything
    image: units-lab-everything:local
    profiles: [everything]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/mcp',{method:'POST'}).then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 1s
      retries: 30

  # The door to models: which there are is litellm/models.yaml, or the file
  # LAB_LLM_CONFIG names. Providers' keys come from .env.
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.0
    restart: unless-stopped
    command: ["--config", "/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LAB_LLM_KEY}
      CLOUDFLARE_OPENAI_URL: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:-none}/ai/v1
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      STT_GPU_URL: ${LAB_STT_GPU_URL:-http://stt-gpu.invalid/v1}
      VOXCPM_URL: ${LAB_VOXCPM_URL:-http://voxcpm.invalid/v1}
      VOXCPM_VOICES_URL: ${LAB_VOXCPM_URL:-http://voxcpm.invalid/v1}/audio/voices
      OLLAMA_URL: ${LAB_OLLAMA_URL:-http://ollama.invalid}
    volumes:
      - ${LAB_LLM_CONFIG:-./litellm/models.yaml}:/config.yaml:ro
    depends_on:
      fake_llm:
        condition: service_healthy
      fake_realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 2s
      retries: 90

  # Our speech engines on this machine, under their profile (big images):
  # models piper and silero in LiteLLM. The GPU ones (voxcpm, whisper) run
  # elsewhere, at the URLs in .env.
  piper:
    build: ../../engines/tts/piper
    image: units-engines-tts-piper:local
    profiles: [engines]
    restart: unless-stopped
  silero:
    build:
      context: ../../engines/tts/silero
      args: {ACCEL: "${LAB_SILERO_ACCEL:-xpu}"}
    image: units-engines-tts-silero:local
    profiles: [engines]
    restart: unless-stopped
  # Pictures, drawn at Cloudflare on the same account as the chat model:
  # models images and images-fast in LiteLLM.
  images:
    build: ../../engines/images/cloudflare
    image: units-engines-images-cloudflare:local
    profiles: [engines]
    restart: unless-stopped
    environment:
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
  # Pictures on our own GPU (engines/images/diffusers), offline, from a
  # model directory mounted read-only: model images-local in LiteLLM (also
  # commented out there). Not started on a machine that cannot hold it;
  # uncomment both where one can, the weights at LAB_IMAGES_LOCAL_MODEL.
  # images-local:
  #   build:
  #     context: ../../engines/images/diffusers
  #     args: {ACCEL: "${LAB_IMAGES_LOCAL_ACCEL:-xpu}"}
  #   image: units-engines-images-diffusers:local
  #   profiles: [engines]
  #   restart: unless-stopped
  #   devices: ["/dev/dri:/dev/dri"]
  #   environment:
  #     UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
  #   volumes:
  #     - ${LAB_IMAGES_LOCAL_MODEL:-./no-model}:/models/model:ro

  # Our own realtime model (minds/realtime): a call in OpenAI's Realtime
  # schema made of organs — hearing finds the caller's utterances and their
  # words, a chat model through LiteLLM answers, speaking says it. LiteLLM
  # reaches it as `cascade` (litellm/models.yaml); the organs' events go on
  # a Redis of their own (bus). Its ear, chat model and voice are what the
  # page's avatars prefer (its settings); LAB_CASCADE_* when it names none. The
  # language is found by STT in each utterance.
  realtime:
    build: ../../minds/realtime
    image: units-minds-realtime:local
    restart: unless-stopped
    environment:
      LLM_URL: http://litellm:4000
      LLM_KEY: ${LAB_LLM_KEY}
      LLM_MODEL: ${LAB_CASCADE_LLM_MODEL:-fake}
      VOICE: ${LAB_CASCADE_VOICE:-fake-tts_alloy}
      SYSTEM_PROMPT: ${LAB_CASCADE_PROMPT:-}
      REDIS_ADDR: bus:6379
      AUDIO_IN_HOST: realtime
      HEARING_URL: http://hearing:8080/mcp
      SPEAKING_URL: http://speaking:8080/
    depends_on:
      bus: {condition: service_healthy}
      hearing: {condition: service_started}
      speaking: {condition: service_started}
  hearing:
    build: ../../senses/hearing
    image: units-senses-hearing:local
    restart: unless-stopped
    environment:
      REDIS_ADDR: bus:6379
      STT_URL: http://litellm:4000/v1
      STT_KEY: ${LAB_LLM_KEY}
      STT_MODEL: ${LAB_CASCADE_STT_MODEL:-fake-stt}
      # energy: no VAD engine to run; silero needs engines/vad/silero at VAD_URL
      HEARING_VAD: ${LAB_CASCADE_VAD:-energy}
      VAD_URL: http://vad:8096
      AUDIO_IN_HOST: hearing
    depends_on:
      bus: {condition: service_healthy}
  speaking:
    build: ../../abilities/speaking
    image: units-abilities-speaking:local
    restart: unless-stopped
    environment:
      REDIS_ADDR: bus:6379
      TTS_URL: http://litellm:4000/v1
      TTS_KEY: ${LAB_LLM_KEY}
    depends_on:
      bus: {condition: service_healthy}
  bus:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  # A model that answers from files, the same each time: fake_llm/README.md.
  fake_llm:
    image: wiremock/wiremock:3.13.2
    restart: unless-stopped
    command: ["--port", "8089", "--disable-banner"]
    volumes:
      - ./fake_llm/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8089/health"]
      interval: 2s
      retries: 60

  # A realtime model that answers from a script, in the event flow a real
  # one was seen to send: fake_realtime/README.md.
  fake_realtime:
    build: ./fake_realtime
    image: units-lab-fake-realtime:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8090), 1)"]
      interval: 1s
      retries: 30

  # A person in a real browser: e2e/chat.mjs. The browser goes to LAB_URL
  # as a person's would, its name and port as they are, but on the lab's
  # own network: LAB_DOMAIN is this container's loopback, where a door
  # (E2E_DOOR) leads to nginx. Not on the host's network, where every
  # bridge Docker adds or removes (another lab up or down) is a network
  # change to Chromium, which aborts what it was loading.
  e2e:
    build: ./e2e
    image: units-lab-e2e:local
    profiles: [e2e]
    extra_hosts:
      - ${LAB_DOMAIN}:127.0.0.1
    environment:
      LAB_URL: ${LAB_URL}
      E2E_DOOR: nginx:443
      LAB_LLM_MODEL: ${LAB_LLM_MODEL:-fake}
      LAB_STT_MODEL: ${LAB_STT_MODEL:-}
      LAB_REALTIME_MODEL: ${LAB_REALTIME_MODEL:-}
      E2E_VOICE_FILE: ${E2E_VOICE_FILE:-}
      E2E_TIMEOUT_MS: ${E2E_TIMEOUT_MS:-60000}
      E2E_ONLY: ${E2E_ONLY:-}
      E2E_FIRST_LOGIN: ${E2E_FIRST_LOGIN:-}
      E2E_SHOT: ${E2E_SHOT:-}
    depends_on:
      nginx:
        condition: service_healthy

  demo:
    image: curlimages/curl:8.11.1
    profiles: [demo]
    user: "0"
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      LAB_URL: ${LAB_URL}
    volumes:
      - ./demo.sh:/demo.sh:ro
    entrypoint: ["sh", "/demo.sh"]

volumes:
  data:
  secrets:
  redis:
  certs:
  subjects-db:
  reins-db:
  threads-db:

# The databases' networks are internal: only their service joins them.
networks:
  default:
  subjects-db:
    internal: true
  reins-db:
    internal: true
  threads-db:
    internal: true
