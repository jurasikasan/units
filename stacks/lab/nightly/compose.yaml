# The nightly's watch: a bus and the notifier on it, up for good beside
# the jobs (run.sh). A job that has something to say puts one ops event on
# this bus (tell.sh); the notifier says it to a person. Its own bus, not a
# lab's: a lab is what the jobs test, and the throwaway ones go away.
#
# `cp .env.example .env && docker compose up -d --wait` here. From
# .env.example the messages go to a fake Telegram that prints them
# (`docker compose logs fake_telegram`); a deployment's .env names the bot
# and the chat (README, "Nightly").
name: lab-nightly-watch

services:
  bus:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bus:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  notifier:
    build: ../../../notifier
    image: units-notifier:${UNITS_TAG:-local}
    restart: unless-stopped
    depends_on:
      bus:
        condition: service_healthy
    environment:
      REDIS_ADDR: bus:6379
      NOTIFIER_NAME: ${NIGHTLY_NAME:-lab-nightly}
      # A red run is an error; news, nothing red, a warning.
      NOTIFIER_MIN_SEVERITY: warn
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?the bot's token, in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?the chat, in .env}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}

  # Profile fake_telegram (.env.example's): a Telegram that prints what it
  # gets, for a run without a bot.
  fake_telegram:
    image: python:3.12-alpine
    profiles: [fake_telegram]
    restart: unless-stopped
    command:
      - python3
      - -u
      - -c
      - |
        import http.server, urllib.parse
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                form = urllib.parse.parse_qs(self.rfile.read(int(self.headers["Content-Length"])).decode())
                print("telegram got:", form["text"][0], flush=True)
                self.send_response(200); self.end_headers(); self.wfile.write(b'{"ok":true}')
            def log_message(self, *a): pass
        http.server.HTTPServer(("", 8080), H).serve_forever()

volumes:
  bus:
