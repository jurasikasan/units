# The lab's models; the mind asks for one by name (LAB_LLM_MODEL).
#
# fake answers from files (fake_llm/), the same each time and with no key:
# what check.sh and e2e run on. The others are real providers, each reading
# its key from .env; a group whose key is empty fails when asked, nothing
# else. Retries and fallbacks are LiteLLM's, not the mind's.
model_list:
  - model_name: fake
    litellm_params:
      model: openai/fake-1
      api_base: http://fake_llm:8089/v1
      api_key: fake
      timeout: 30

  # The same fake, declared to take words only: what a model that cannot
  # take a picture is, for the mind to say so (check.sh's second round).
  # Its own model name: LiteLLM keeps model_info by the provider's model,
  # so under fake-1 it would say the same of fake.
  - model_name: fake-text
    litellm_params:
      model: openai/fake-text-1
      api_base: http://fake_llm:8089/v1
      api_key: fake
      timeout: 30
    model_info: {supports_vision: false, supports_pdf_input: false, supports_audio_input: false}

  # A light chat model: Cloudflare's glm-4.7-flash through its OpenAI door,
  # then z.ai's own, which takes one request at a time and says "busy"
  # rather than "spent", so it never rests. Words only: both answer a
  # picture or a file with a 400, and LiteLLM's map of models does not know
  # them, so model_info says it (the mind reads it from /model/info).
  - model_name: chat
    litellm_params:
      model: openai/@cf/zai-org/glm-4.7-flash
      api_base: os.environ/CLOUDFLARE_OPENAI_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      order: 1
      timeout: 120
    model_info: {id: chat-cf, supports_vision: false, supports_pdf_input: false, supports_audio_input: false}
  - model_name: chat
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      order: 2
      max_parallel_requests: 1
      cooldown_time: 0
      timeout: 120
    model_info: {id: chat-zai, supports_vision: false, supports_pdf_input: false, supports_audio_input: false}

  # Gemini shows its reasoning only at reasoning_effort high; lower, it is
  # counted in tokens and never shown.
  - model_name: lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: high
      timeout: 120

  # Sound, turn by turn: OpenAI's audio API, which the mind hands on
  # (STT_MODEL, TTS_MODEL). The fakes answer from fake_llm: a fixed text for
  # any sound, a quarter-second beep (WAV) for any words.
  - model_name: fake-stt
    litellm_params:
      model: openai/fake-whisper
      api_base: http://fake_llm:8089/v1
      api_key: fake
    model_info: {mode: audio_transcription}
  - model_name: fake-tts
    litellm_params:
      model: openai/fake-tts
      api_base: http://fake_llm:8089/v1
      api_key: fake
    model_info: {mode: audio_speech}

  # Second fakes: a pick of another ear or mouth shows in what comes back
  # (fake_llm: `What the second fake ear heard.`, a shorter, lower tone,
  # voices denis and irina; another voice is refused).
  - model_name: fake-stt-b
    litellm_params:
      model: openai/fake-whisper-b
      api_base: http://fake_llm:8089/v1
      api_key: fake
    model_info: {mode: audio_transcription}
  - model_name: fake-tts-b
    litellm_params:
      model: openai/fake-tts-b
      api_base: http://fake_llm:8089/v1
      api_key: fake
    model_info: {mode: audio_speech}

  # Groq's whisper: any language, the formats a browser records (WebM/Opus)
  # included.
  - model_name: stt
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY
      timeout: 60
    model_info: {mode: audio_transcription}

  # Whisper large-v3 on a GPU box (engines/stt/whisper, bot's gpu profile),
  # at LAB_STT_GPU_URL; stt falls back to it, and it can be picked itself.
  # Unset, it points at .invalid: LiteLLM would otherwise send the sound
  # to api.openai.com.
  - model_name: whisper-gpu
    litellm_params: {model: openai/whisper, api_base: os.environ/STT_GPU_URL, api_key: none, timeout: 30}
    model_info: {mode: audio_transcription}

  # Our speech engines (engines/tts): piper and silero run in the lab under
  # the `engines` profile, voxcpm on a GPU box at LAB_VOXCPM_URL. WAV only,
  # their own voices: each lists them at GET /v1/audio/voices, which the
  # pass-throughs below put at /audio/voices/<model> for the mind.
  - model_name: piper
    litellm_params: {model: openai/piper, api_base: http://piper:8000/v1, api_key: none, timeout: 15}
    model_info: {mode: audio_speech}
  - model_name: silero
    litellm_params: {model: openai/silero, api_base: http://silero:8000/v1, api_key: none, timeout: 30}
    model_info: {mode: audio_speech}
  - model_name: voxcpm
    litellm_params: {model: openai/voxcpm, api_base: os.environ/VOXCPM_URL, api_key: none, timeout: 60}
    model_info: {mode: audio_speech}

  # Pictures: OpenAI's Images API (generations, edits), our adapter to
  # Cloudflare (engines/images/cloudflare) under the `engines` profile.
  # images: FLUX.2 klein 4B, sized, takes reference images to edit;
  # images-fast: FLUX.1 schnell, ~2 s, 1024x1024 whatever is asked.
  - model_name: images
    litellm_params: {model: openai/black-forest-labs/flux-2-klein-4b, api_base: http://images:8000/v1, api_key: none, timeout: 120}
    model_info: {mode: image_generation}
  - model_name: images-fast
    litellm_params: {model: openai/black-forest-labs/flux-1-schnell, api_base: http://images:8000/v1, api_key: none, timeout: 60}
    model_info: {mode: image_generation}
  # The fake: any prompt is the same picture, a red circle (fake_llm), no
  # key, no cloud: what the tool draws with in check.sh's e2e.
  - model_name: fake-images
    litellm_params: {model: openai/fake-images, api_base: http://fake_llm:8089/v1, api_key: fake}
    model_info: {mode: image_generation}
  # Our own GPU (engines/images/diffusers), the images-local service in
  # compose.yaml, both commented out until a machine here is to run it.
  # - model_name: images-local
  #   litellm_params: {model: openai/images-local, api_base: http://images-local:8000/v1, api_key: none, timeout: 300}
  #   model_info: {mode: image_generation}

  # A chat model on the GPU box's Ollama, at LAB_OLLAMA_URL.
  - model_name: local
    litellm_params: {model: ollama_chat/gpt-oss:20b, api_base: os.environ/OLLAMA_URL, timeout: 300}

  # Gemini's speech: WAV only (24 kHz, 16-bit mono; mp3 or opus asked for
  # is refused), its own voices (Kore, Puck, …; OpenAI's names map to some),
  # many languages. To try: Gemini is not what the lab runs on.
  - model_name: tts
    litellm_params:
      model: gemini/gemini-3.8-flash-lite-tts
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info: {mode: audio_speech}

  # A call, sound both ways, live: OpenAI's Realtime API at /v1/realtime,
  # which the mind relays (REALTIME_MODEL). Both answer from a script
  # (fake_realtime/): fake-realtime in the flow Gemini Live sent through
  # LiteLLM, fake-realtime-full in the schema's whole set. LiteLLM hands
  # OpenAI's events on as they are.
  - model_name: fake-realtime
    litellm_params:
      model: openai/fake-realtime
      api_base: http://fake_realtime:8090
      api_key: fake
    model_info: {mode: realtime}
  - model_name: fake-realtime-full
    litellm_params:
      model: openai/fake-realtime-full
      api_base: http://fake_realtime:8090
      api_key: fake
    model_info: {mode: realtime}

  # Our own realtime (minds/realtime): hearing, a chat model, speaking,
  # behind the same schema; the full set of events, truncate honoured.
  - model_name: cascade
    litellm_params:
      model: openai/cascade
      api_base: http://realtime:8080
      api_key: none
    model_info: {mode: realtime}

router_settings:
  fallbacks:
    - stt: [whisper-gpu]
  num_retries: 1
  timeout: 300

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # A speech model's voices, which OpenAI's API has no call for: the
  # engine's own list, behind LiteLLM's key. The mind asks
  # /audio/voices/<model>.
  pass_through_endpoints:
    - {path: /audio/voices/fake-tts-b, target: "http://fake_llm:8089/v1/audio/voices"}
    - {path: /audio/voices/piper, target: "http://piper:8000/v1/audio/voices"}
    - {path: /audio/voices/silero, target: "http://silero:8000/v1/audio/voices"}
    - {path: /audio/voices/voxcpm, target: os.environ/VOXCPM_VOICES_URL}
