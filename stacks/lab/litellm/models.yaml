# The lab's models; the mind asks for one by name (LAB_LLM_MODEL).
#
# fake answers from files (fake_llm/), the same each time and with no key:
# what check.sh and e2e run on. The others are real providers, each reading
# its key from .env; a group whose key is empty fails when asked, nothing
# else. Retries and fallbacks are LiteLLM's, not the mind's.
model_list:
  - model_name: fake
    litellm_params:
      model: openai/fake-1
      api_base: http://fake_llm:8089/v1
      api_key: fake
      timeout: 30

  # The same fake, declared to take words only: what a model that cannot
  # take a picture is, for the mind to say so (check.sh's second round).
  # Its own model name: LiteLLM keeps model_info by the provider's model,
  # so under fake-1 it would say the same of fake.
  - model_name: fake-text
    litellm_params:
      model: openai/fake-text-1
      api_base: http://fake_llm:8089/v1
      api_key: fake
      timeout: 30
    model_info: {supports_vision: false, supports_pdf_input: false, supports_audio_input: false}

  # A light chat model: Cloudflare's glm-4.7-flash through its OpenAI door,
  # then z.ai's own, which takes one request at a time and says "busy"
  # rather than "spent", so it never rests. Words only: both answer a
  # picture or a file with a 400, and LiteLLM's map of models does not know
  # them, so model_info says it (the mind reads it from /model/info).
  - model_name: chat
    litellm_params:
      model: openai/@cf/zai-org/glm-4.7-flash
      api_base: os.environ/CLOUDFLARE_OPENAI_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      order: 1
      timeout: 120
    model_info: {id: chat-cf, supports_vision: false, supports_pdf_input: false, supports_audio_input: false}
  - model_name: chat
    litellm_params:
      model: openai/glm-4.7-flash
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
      order: 2
      max_parallel_requests: 1
      cooldown_time: 0
      timeout: 120
    model_info: {id: chat-zai, supports_vision: false, supports_pdf_input: false, supports_audio_input: false}

  # Gemini shows its reasoning only at reasoning_effort high; lower, it is
  # counted in tokens and never shown.
  - model_name: lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: high
      timeout: 120

  # Sound, turn by turn: OpenAI's audio API, which the mind hands on
  # (STT_MODEL, TTS_MODEL). The fakes answer from fake_llm: a fixed text for
  # any sound, a quarter-second beep (WAV) for any words.
  - model_name: fake-stt
    litellm_params:
      model: openai/fake-whisper
      api_base: http://fake_llm:8089/v1
      api_key: fake
    model_info: {mode: audio_transcription}
  - model_name: fake-tts
    litellm_params:
      model: openai/fake-tts
      api_base: http://fake_llm:8089/v1
      api_key: fake
    model_info: {mode: audio_speech}

  # Groq's whisper: any language, the formats a browser records (WebM/Opus)
  # included.
  - model_name: stt
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY
      timeout: 60
    model_info: {mode: audio_transcription}

  # Gemini's speech: WAV only (24 kHz, 16-bit mono; mp3 or opus asked for
  # is refused), its own voices (Kore, Puck, …; OpenAI's names map to some),
  # many languages. To try: Gemini is not what the lab runs on.
  - model_name: tts
    litellm_params:
      model: gemini/gemini-3.8-flash-lite-tts
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info: {mode: audio_speech}

router_settings:
  num_retries: 1
  timeout: 300

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
